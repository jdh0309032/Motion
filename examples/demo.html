<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Demo Motion</title>
<style>
  :root { --bg:#0f1020; --accent:#ff5c8a; --accent2:#5cc8ff; --text:#ffffff; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif}
  .stage{position:relative;width:100%;height:100%;display:grid;place-items:center}
  .ring{position:absolute;width:260px;height:260px;border-radius:50%;border:6px solid var(--accent2);
        animation:pulse 3s ease-in-out infinite}
  .dot{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--accent);
       animation:orbit 4s linear infinite}
  h1{color:var(--text);font-size:56px;margin:0;opacity:0;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) .4s forwards}
  p{color:var(--accent2);position:absolute;bottom:18%;font-size:20px;letter-spacing:.3em;opacity:0;
    animation:rise 1s ease-out 1.2s forwards}
  @keyframes pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.1);opacity:1}}
  @keyframes orbit{from{transform:rotate(0) translateX(160px)}to{transform:rotate(360deg) translateX(160px)}}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="ring"></div>
  <div class="dot"></div>
  <h1>Hello Motion</h1>
  <p>MADE WITH CLAUDE CODE</p>
</div>
</body>
</html>

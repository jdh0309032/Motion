<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Particle Title</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#05060d;font-family:Inter,system-ui,sans-serif}
  canvas{position:absolute;inset:0}
  .t{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:120px;font-weight:800;letter-spacing:-2px}
  .tag{position:absolute;left:50%;top:64%;transform:translateX(-50%);color:#9be7ff;font-size:28px;letter-spacing:10px}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="t">STARFIELD</div>
<div class="tag">A CLAUDE CODE PIECE</div>
<script>
  const c = document.getElementById('c'), g = c.getContext('2d');
  const P = Array.from({length: 400}, () => ({ x: Math.random()*1920, y: Math.random()*1080, z: Math.random()*2+0.3 }));
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    g.fillStyle = 'rgba(5,6,13,0.35)'; g.fillRect(0,0,1920,1080);
    for (const p of P) { const x = (p.x + t * 120 * p.z) % 1920; g.fillStyle = `rgba(155,231,255,${0.3+p.z/3})`; g.fillRect(x, p.y, p.z*2, p.z*2); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  gsap.timeline()
    .from('.t', { opacity: 0, scale: 0.6, duration: 1.2, ease: 'expo.out' })
    .from('.tag', { opacity: 0, y: 40, duration: 0.8, ease: 'power2.out' }, '-=0.6');
</script>
</body>
</html>
